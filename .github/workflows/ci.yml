name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Tag v<deno.json version> on this commit and publish the release (main only)"
        type: boolean
        default: false

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno fmt --check
      - run: deno lint
      - run: deno check src/main.ts
      - run: deno test -A tests/

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Compile and package
        shell: bash
        run: |
          ext=""; [[ "${{ matrix.target }}" == *windows* ]] && ext=".exe"
          deno compile -A --include docs --target ${{ matrix.target }} \
            -o "build/ai-bootstrap${ext}" src/main.ts
          sh scripts/package.sh ${{ matrix.target }} "build/ai-bootstrap${ext}" dist
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: ai-bootstrap-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # Each binary on matching hardware: it starts, reports its target, and
  # carries the knowledge base (searchable directly and through tool calls).
  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/download-artifact@v4
        with:
          name: ai-bootstrap-${{ matrix.target }}
          path: dist
      # Unpack the way a user would: tar on Linux, the script on macOS, a zip on Windows.
      - name: Unpack
        if: runner.os == 'Linux'
        run: tar -xzf "dist/ai-bootstrap-$(jq -r .version deno.json)-${{ matrix.target }}.tar.gz" -C dist
      - name: Unpack
        if: runner.os == 'macOS'
        run: |
          sh "dist/ai-bootstrap-$(jq -r .version deno.json)-${{ matrix.target }}.sh" | tee extract.txt
          out=$(tail -1 extract.txt)
          test "$out" = "$PWD/dist/ai-bootstrap"
          codesign --verify --verbose "$out"
      - name: Unpack
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = (Get-Content deno.json -Raw | ConvertFrom-Json).version
          Expand-Archive -Path "dist/ai-bootstrap-$v-${{ matrix.target }}.zip" -DestinationPath dist
      - name: Run the binary
        shell: bash
        run: |
          bin=dist/ai-bootstrap; [ -f "$bin.exe" ] && bin="$bin.exe"
          "$bin" --version | tee version.txt
          grep -q "${{ matrix.target }}" version.txt
          "$bin" --paths
          "$bin" --docs
          p="$PWD/$bin"
          if command -v cygpath >/dev/null; then p=$(cygpath -w "$p"); fi
          echo "AIBOOT_BIN=$p" >> "$GITHUB_ENV"
      - name: Knowledge base is embedded and searchable
        run: deno test -A tests/knowledge_test.ts

  # Publishes on a pushed v* tag, or on a manual run with release: true,
  # which creates the v<version> tag on the commit that was tested.
  release:
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main')
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true
          fetch-depth: 0
      - name: Work out the tag
        id: tag
        run: |
          v="v$(jq -r .version deno.json)"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            [ "$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != $v from deno.json"; exit 1; }
          elif git rev-parse -q --verify "refs/tags/$v" >/dev/null; then
            echo "$v already exists; bump the version in deno.json first"; exit 1
          fi
          echo "name=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum ai-bootstrap-* > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: ai-bootstrap ${{ steps.tag.outputs.name }}
          files: dist/*
          generate_release_notes: true
