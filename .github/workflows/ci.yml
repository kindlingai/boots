name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: mmastrac/marsh
          path: .marsh
      - uses: dtolnay/rust-toolchain@stable
      - name: Build marsh
        run: cargo build --release --manifest-path .marsh/Cargo.toml
      - name: Check and test
        run: |
          export PATH="$PWD/.marsh/target/release:$PATH"
          marsh check aiboot.marsh
          tests/e2e.sh
      - name: Build the portable script
        run: .marsh/target/release/marsh build aiboot.marsh -o aiboot.sh
      - uses: actions/upload-artifact@v4
        with:
          name: aiboot.sh
          path: aiboot.sh

  worker-image:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: container
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ai-bootstrap-worker:latest
