name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno fmt --check
      - run: deno lint
      - run: deno check src/main.ts
      - run: deno test -A tests/

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Compile
        shell: bash
        run: |
          ext=""; [[ "${{ matrix.target }}" == *windows* ]] && ext=".exe"
          deno compile -A --include docs --target ${{ matrix.target }} \
            -o "dist/ai-bootstrap-${{ matrix.target }}${ext}" src/main.ts
      - uses: actions/upload-artifact@v4
        with:
          name: ai-bootstrap-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # Each binary on matching hardware: it starts, reports its target, and
  # carries the knowledge base (searchable directly and through tool calls).
  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/download-artifact@v4
        with:
          name: ai-bootstrap-${{ matrix.target }}
          path: dist
      - name: Run the binary
        shell: bash
        run: |
          bin=$(ls dist/ai-bootstrap-*)
          chmod +x "$bin"
          "$bin" --version | tee version.txt
          grep -q "${{ matrix.target }}" version.txt
          "$bin" --paths
          "$bin" --docs
          p="$PWD/$bin"
          if command -v cygpath >/dev/null; then p=$(cygpath -w "$p"); fi
          echo "AIBOOT_BIN=$p" >> "$GITHUB_ENV"
      - name: Knowledge base is embedded and searchable
        run: deno test -A tests/knowledge_test.ts

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches deno.json version
        run: |
          v=$(jq -r .version deno.json)
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != v$v"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum ai-bootstrap-* > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
